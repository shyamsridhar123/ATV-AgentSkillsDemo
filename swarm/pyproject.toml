[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beth-swarm"
version = "0.1.0"
description = "Beth Agent Swarm — persistent Python daemon for multi-agent orchestration"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.40",
    "tiktoken>=0.7",
    "azure-identity>=1.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["swarm"]

[project.scripts]
swarm = "swarm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "smoke_*.py"]
asyncio_mode = "auto"
markers = [
    "live: marks tests that hit real Azure endpoints (deselect with '-m \"not live\"')",
]
